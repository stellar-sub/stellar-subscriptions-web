name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check formatting
        run: npm run format:check
      - run: npm run format:check

  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check:licenses
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run analyze
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: .next/analyze
          if-no-files-found: ignore
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test
